name: Go checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format, vet, mock integration, race and build
        shell: bash
        run: bash scripts/check.sh

  required:
    name: Diffaro CI
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the entire test matrix to pass
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "Test matrix did not pass: $MATRIX_RESULT"
            exit 1
          fi
