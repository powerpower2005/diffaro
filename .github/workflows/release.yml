name: Diffaro binary release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: diffaro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      RELEASE_TARGETS: linux/amd64,darwin/amd64,darwin/arm64
    timeout-minutes: 30
    outputs:
      install-matrix: ${{ steps.targets.outputs.install-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release commit to belong to main
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a merged main commit."
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check quality gates
        run: bash scripts/check.sh
      - name: Select release platforms and native install runners
        id: targets
        shell: bash
        run: |
          python3 <<'PY'
          import json, os
          value = os.environ['RELEASE_TARGETS']
          supported = {f'{system}/{arch}' for system in ('linux', 'darwin') for arch in ('amd64', 'arm64')}
          requested = value.split(',')
          selected = supported if value == 'all' else {item.strip() for item in requested}
          if not selected or not selected <= supported or (value != 'all' and len(selected) != len(requested)):
              raise SystemExit('Invalid release platform selection')
          runners = {'linux/amd64': 'ubuntu-latest', 'darwin/amd64': 'macos-15-intel', 'darwin/arm64': 'macos-15'}
          native = [{'os': runner} for target, runner in runners.items() if target in selected]
          if not native:
              raise SystemExit('Selected platforms have no configured native install runner')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + value + '\n')
              output.write('install-matrix=' + json.dumps({'include': native}) + '\n')
          PY
      - name: Build tagged release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TARGETS: ${{ steps.targets.outputs.targets }}
        run: go run ./scripts/release -version "$RELEASE_TAG" -targets "$RELEASE_TARGETS" -output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diffaro-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.install-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: diffaro-release
          path: dist
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install and run the native archive without Go or Git
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        shell: bash
        run: bash scripts/release/smoke.sh "$RELEASE_TAG" "$RELEASE_REVISION" dist
      - name: Run first-use flow with the installed native binary and mock backends
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in Linux) platform=linux ;; Darwin) platform=darwin ;; *) exit 1 ;; esac
          case "$(uname -m)" in x86_64) architecture=amd64 ;; arm64|aarch64) architecture=arm64 ;; *) exit 1 ;; esac
          directory="$PWD/.cache/installed-release"
          mkdir -p "$directory"
          tar -xzf "dist/diffaro_${RELEASE_TAG}_${platform}_${architecture}.tar.gz" -C "$directory"
          DIFFARO_TEST_INSTALLED_BINARY="$directory/diffaro" go test ./internal/cli -run '^Test(InstalledBinary|BundledHelmFirstUseAndNewChild|CatalogInitToDoctorAndMultiRepositoryPRArtifacts)' -count=1

  publish:
    needs: [build, install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: diffaro-release
          path: dist
      - name: Verify and publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          options=(--verify-tag --title "Diffaro $RELEASE_TAG" --notes-file RELEASE_NOTES.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          shopt -s nullglob
          archives=(./*.tar.gz)
          (( ${#archives[@]} > 0 ))
          gh release create "$RELEASE_TAG" "${options[@]}" "${archives[@]}" SHA256SUMS
